<script>

const SEED=JSON.parse(document.getElementById('seed-data').textContent);
const META=SEED.meta;
const KEY='lyh_career_intelligence_v1';
const DEFAULT={view:'dashboard',theme:'light',filters:{q:'',category:'全部',gate:'全部',city:'全部',sort:'priority',fav:false},companyQ:'',weights:{...META.weights},prefs:{start:'2026-11-20',end:'2027-02-05',days:5,cities:[],cityRent:{},commute:{}},favs:[],progress:{},jobNotes:{},companyNotes:{},companyEvents:{},materialExpanded:[],materialSelected:{},interviewDone:{},ratingOverrides:{},lastVerified:{},intelJobs:{},intelCompanies:{},customJobs:[],customCompanies:[],updatedAt:''};

let state=loadState();
let opened={kind:null,id:null,tab:'overview'};
let addMode='job';
let toastTimer;
const $=q=>document.querySelector(q);

const safeUrl=u=>/^https?:\/\//i.test(String(u||''))?String(u):'';
const fmtDate=d=>d?String(d).replace(/-/g,'.'):'待核验';
const now=()=>new Date();
const daysSince=(d)=>{const t=new Date(d+'T12:00:00');return Number.isNaN(t.getTime())?null:Math.floor((now().getTime()-t.getTime())/86400000)};

const catColor={'政策研究':'#427b78','行业研究':'#668b79','用户研究':'#bd8762','AI产品/运营':'#8c8bb6','内容/项目':'#b7a062'};
const logoColor=['#dae9e2','#f4e8d9','#dce7f5','#f4e4dc','#e5e5f1','#e6efdf'];
const icons={dashboard:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',briefcase:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18M10 13v2h4v-2"/>',building:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 21v-4h6v4M8 7h1M15 7h1M8 11h1M15 11h1"/>',pipeline:'<rect x="3" y="4" width="6" height="16" rx="2"/><rect x="10" y="4" width="5" height="11" rx="2"/><rect x="16" y="4" width="5" height="16" rx="2"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',sliders:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="17" r="2"/>',search:'<circle cx="10.7" cy="10.7" r="6.5"/><path d="m16 16 5 5"/>',bookmark:'<path d="M5 4h14v17l-7-5-7 5V4z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',chart:'<path d="M3 20h18M6 17V9M12 17V4M18 17v-6"/>',chev:'<path d="m9 18 6-6-6-6"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',external:'<path d="M13 5h6v6M19 5l-9 9"/><path d="M19 14v5H5V5h5"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',check:'<path d="m4 12 5 5L20 6"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 10v6M12 7h.01"/>',shield:'<path d="M12 22S4 18 4 11V5l8-3 8 3v6c0 7-8 11-8 11Z"/><path d="m9 12 2 2 4-4"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/>',upload:'<path d="M12 16V4m-4 4 4-4 4 4M4 17v4h16v-4"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M20 15.7A9 9 0 0 1 8.3 4a9 9 0 1 0 11.7 11.7Z"/>',warning:'<path d="m12 3 function ic(name,cls=''){return `<svg class="${esc(cls)}" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.info}</svg>`;}
function loadState(){try{const raw=localStorage.getItem(KEY);if(!raw)return structuredClone(DEFAULT);const data=JSON.parse(raw);return {...structuredClone(DEFAULT),...data,filters:{...DEFAULT.filters,...(data.filters||{})},weights:{...DEFAULT.weights,...(data.weights||{})},prefs:{...DEFAULT.prefs,...(data.prefs||{})}}}catch(err){canStore=false;return structuredClone(DEFAULT)}}
function save(){state.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(state));canStore=true}catch(e){canStore=false;showToast('本地保存不可用：请及时导出数据备份。')}updateClock();}
function showToast(message){const t=byId('toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
function getCompanies(){const m=new Map([...SEED.companies,...(state.customCompanies||[])].map(o=>[o.id,{...o}]));Object.entries(state.intelCompanies||{}).forEach(([id,patch])=>{const old=m.get(id)||{id,name:id,sources:[],timeline:[],leaders:[]};m.set(id,{...old,...patch,timeline:[...(old.timeline||[]),...(patch.appendTimeline||[])],sources:[...(old.sources||[]),...(patch.appendSources||[])],leaders:[...(old.leaders||[]),...(patch.appendLeaders||[])]})});return [...m.values()]}
function getJobs(){const m=new Map([...SEED.jobs,...(state.customJobs||[])].map(o=>[o.id,{...o}]));Object.entries(state.intelJobs||{}).forEach(([id,patch])=>{const old=m.get(id)||{id,title:'新岗位',company:'',ratings:[2.5,2.5,2.5,2.5,2.5,2.5]};m.set(id,{...old,...patch})});return [...m.values()]}
function getCompany(id){return getCompanies().find(c=>c.id===id)||{id,name:'待核实机构',monogram:'?',sources:[],timeline:[],leaders:[],confidence:'C'}}
function getJob(id){return getJobs().find(j=>j.id===id)}
function getMat(id){return SEED.materials.ITEMS.find(x=>x.id===id)}
function status(id){return state.progress[id]||'候选'}
function weightsSum(){return Object.values(state.weights).reduce((s,n)=>s+(Number(n)||0),0)||100}
function scoreDetail(job){const w=state.weights, overrides=state.ratingOverrides[job.id]||{},sum=weightsSum();let score=0;const values={};dim.forEach((d,i)=>{let v=overrides[d.id]!==undefined?+overrides[d.id]:(job.ratings||[2.5,2.5,2.5,2.5,2.5,2.5])[i];v=Math.max(0,Math.min(5,v));values[d.id]=v;score+=v*(+w[d.id]||0)/sum*20});return {score:Math.round(score*10)/10,values}}
function sortedJobs(){const f=state.filters;let list=getJobs().filter(j=>{const c=getCompany(j.company);const q=f.q.toLowerCase();if(q&&!`${j.title} ${j.category} ${j.city} ${c.name} ${c.sector} ${j.why}`.toLowerCase().includes(q))return false;if(f.category!=='全部'&&j.category!==f.category)return false;if(f.city!=='全部'&&j.city!==f.city)return false;if(f.gate!=='全部'&&j.gate!==f.gate)return false;if(f.fav&&!state.favs.includes(j.id))return false;return true});const order={'pass':0,'unknown':1,'ask':2,'block':3};list.sort((a,b)=>{const aa=scoreDetail(a).score,bb=scoreDetail(b).score;if(f.sort==='score')return bb-aa;if(f.sort==='deadline')return (a.deadline||'9999').localeCompare(b.deadline||'9999');if(f.sort==='newest')return (b.posted||'').localeCompare(a.posted||'');if(f.sort==='company')return getCompany(a.company).name.localeCompare(getCompany(b.company).name,'zh');return order[a.gate]-order[b.gate]||bb-aa});return list}
function expiring(job){if(!job.deadline)return '';const date=new Date(job.deadline+'T23:59:59');if(now()>date)return '已过截止日';const days=Math.ceil((date.getTime()-now().getTime())/86400000);return days<=2?'临近截止':days<=8?'本周截止':''}
function gate(job){return ({pass:['时长初步匹配','good'],unknown:['时长待核验','warn'],ask:['需协商时长','warn'],block:['时长硬冲突','bad']})[job.gate]||['待判断','neutral']}
function gateBadge(job){const [label,cl]=gate(job);let exp=expiring(job);return `<span class="pilltag ${exp==='已过截止日'?'bad':cl}">${exp==='已过截止日'?'已过原截止日':label}</span>`}
function confBadge(letter){return `<span class="pilltag ${letter==='A'?'good':letter==='B'?'warn':'neutral'}">证据${esc(letter||'C')}级</span>`}
function brandLogo(c,cls=''){const n=(c.name||'?').length;const bg=logoColor[Math.abs([...(c.id||'x')].reduce((a,x)=>a+x.charCodeAt(0),0))%logoColor.length];return `<div class="company-logo ${cls}" style="--logo-bg:${bg};--logo-ink:#38645c">${esc(c.monogram||c.name.slice(0,1))}</div>`}
function deadlineLine(job){return `<span class="${expiring(job)?'deadline-note':'muted'}">${ic('calendar')} 截止 ${esc(fmtDate(job.deadline))}${expiring(job)?' · '+expiring(job):''}</span>`}
function srclink(url,label='查看原始来源'){url=safeUrl(url);return url?`<a class="sourcelink" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)} ${ic('external')}</a>`:'<span class="muted tiny">来源未录入</span>'}
function updateClock(){const l=byId('sidebar-count');if(l)l.textContent=getJobs().length;const a=byId('top-updated');if(a)a.textContent=canStore?'数据快照 2026.10.31 · 本地可保存':'本地保存受限 · 请导出备份';}
function navView(view){state.view=view;state.filters.q=view==='jobs'?state.filters.q:'';save();render();window.scrollTo({top:0,behavior:'smooth'});}

function openDetail(kind,id,tab){opened={kind,id,tab:tab|| (kind==='company'?'business':'overview')};byId('scrim').classList.add('show');byId('drawer').classList.add('show');byId('drawer').setAttribute('aria-hidden','false');document.body.classList.add('locked');renderDetail();}
function closeDetail(){byId('scrim').classList.remove('show');byId('drawer').classList.remove('show');byId('drawer').setAttribute('aria-hidden','true');document.body.classList.remove('locked');opened.kind=null;}
function renderDetail(){if(!opened.kind)return;const comp=opened.kind==='company'?getCompany(opened.id):getCompany(getJob(opened.id)?.company);const job=opened.kind==='job'?getJob(opened.id):null;const tabs=opened.kind==='company'?[['business','公司画像'],['leaders','领导与团队'],['timeline','动态时间轴'],['jobs','关联岗位'],['sources','来源与笔记']]:[['overview','岗位概览'],['business','公司背调'],['timeline','动态时间轴'],['resume','简历策略'],['interview','面试策略'],['tracking','投递记录'],['sources','情报来源']];if(!tabs.some(x=>x[0]===opened.tab))opened.tab=tabs[0][0];byId('drawer-head').innerHTML=`<div class="drawer-topline">${brandLogo(comp,'mini')}<div class="drawer-title" style="min-width:0"><p>${esc(comp.name)} · ${esc(comp.sector||'待核')}</p><h2>${esc(job?job.title:comp.name)}</h2></div><div class="drawer-spacer"></div><button class="icon-btn" data-action="close" aria-label="关闭详情">${ic('x')}</button></div><div class="tabs" role="tablist">${tabs.map(([k,n])=>`<button class="tab ${opened.tab===k?'active':''}" role="tab" aria-selected="${opened.tab===k}" data-tab="${k}">${n}</button>`).join('')}</div>`;
let content='';switch(opened.tab){case 'overview':content=renderJobOverview(job,comp);break;case 'business':content=renderCompanyBusiness(comp,job);break;case 'leaders':content=renderLeaders(comp);break;case 'timeline':content=renderTimeline(comp);break;case 'jobs':content=renderRelatedJobs(comp);break;case 'resume':content=renderResume(job,comp);break;case 'interview':content=renderInterview(job,comp);break;case 'tracking':content=renderTracking(job,comp);break;case 'sources':content=renderSources(comp,job);break;}byId('drawer-content').innerHTML=content;byId('drawer-content').scrollTop=0;}
function renderJobOverview(j,c){const data=scoreDetail(j);const salaryCalc=calcCost(j);return `<div class="chiprow">${gateBadge(j)}${confBadge(j.confidence)}<span class="pilltag neutral">${esc(j.category)}</span>${expiring(j)?`<span class="pilltag bad">${esc(expiring(j))}</span>`:''}</div><div class="info-grid"><div class="info-mini"><small>工作地点</small><strong>${esc(j.city)}</strong></div><div class="info-mini"><small>实习周期</small><strong>${esc(j.duration)}</strong></div><div class="info-mini"><small>每周出勤</small><strong>${esc(j.days)}</strong></div><div class="info-mini"><small>公开薪资</small><strong>${esc(j.pay)}</strong></div><div class="info-mini"><small>招聘截止</small><strong>${esc(fmtDate(j.deadline))}</strong></div><div class="info-mini"><small>参考评分</small><strong>${data.score.toFixed(1)} / 100</strong></div></div><div class="note-box"><b>初筛判断：</b>${esc(j.why)}<br><span class="muted tiny">此判断不是录用概率；期限和岗位有效性均应与招聘方核实。</span></div><div class="button-group" style="margin:16px 0"><a class="btn primary" href="${esc(safeUrl(j.url)||'#')}" ${j.url?'target="_blank" rel="noopener noreferrer"':''}>${ic('external')} 打开岗位原始页</a><button class="btn" data-action="favorite" data-id="${esc(j.id)}">${ic('bookmark')} ${state.favs.includes(j.id)?'取消收藏':'加入收藏'}</button><button class="btn" data-tab="tracking">更新投递状态 ${ic('arrow')}</button></div><div class="two-col"><div class="content-card"><h3>工作任务</h3>${(j.tasks||[]).map(x=>`<p class="dotline">${esc(x)}</p>`).join('')}</div><div class="content-card"><h3>岗位门槛</h3>${(j.requirements||[]).map(x=>`<p class="dotline">${esc(x)}</p>`).join('')}</div></div><div class="content-card"><h3>六维参考评分 <span class="muted tiny">· 可单项调整</span></h3>${dim.map(d=>`<div class="scoreline"><span class="score-label">${esc(d.name)}</span><div class="track"><div class="fill" style="width:${data.values[d.id]*20}%"></div></div><span class="n">${data.values[d.id].toFixed(1)}</span></div>`).join('')}<p class="small muted">下方可以按你的实际了解修正评分。当前岗位在某些维度因信息缺失仅采用谨慎估计。</p>${dim.map(d=>`<div class="setting-row"><label for="rating-${d.id}">${esc(d.short)}</label><input id="rating-${d.id}" data-rating="${d.id}" type="range" min="0" max="5" step="0.5" value="${data.values[d.id]}"><span class="w-count">${data.values[d.id].toFixed(1)}/5</span></div>`).join('')}<button class="btn smallbtn" data-action="resetrating">还原该岗位初始评分</button></div><div class="content-card"><h3>生活成本估算</h3>${salaryCalc?`<div class="big-quote">${salaryCalc}</div><p>以公开日薪、每周出勤和每月4.33周粗估，再扣除你填写的月住宿与通勤成本；不代表实际工资或净收入。</p>`:`<p>尚不能计算：请先确认日薪金额，并在「评分与数据设置」填写${esc(j.city)}的每月住宿、交通成本。2–3K等口径不明确的薪资不会自动折算。</p>`}</div><div class="content-card"><h3>当前主要风险</h3>${(j.concerns||[]).map(x=>`<p class="dotline">${esc(x)}</p>`).join('')}</div>`}
function calcCost(j){let m=String(j.pay||'').match(/^(\d+)元\/天/);if(!m)return '';let city=j.city, rent=state.prefs.cityRent?.[city],comm=state.prefs.commute?.[city];if(rent===undefined||comm===undefined||rent===''||comm==='')return '';let days=j.days.match(/(\d+)天\/周/);if(!days)return '';const monthly=Number(m[1])*Number(days[1])*4.33-Number(rent)-Number(comm);return `${monthly>=0?'+':''}${Math.round(monthly).toLocaleString('zh-CN')} 元/月（估算结余）`}
function renderCompanyBusiness(c,j){return `<div class="chiprow">${confBadge(c.confidence)}<span class="pilltag neutral">${esc(c.kind||'组织')}</span><span class="pilltag ink">${esc(c.city||'全国')}</span></div><div class="content-card" style="margin-top:15px"><div class="eyebrow">COMPANY PROFILE</div><h3 style="font-size:21px;margin:7px 0">${esc(c.name)}</h3><p>${esc(c.summary||'资料尚未录入')}</p><div class="info-grid" style="margin-bottom:0"><div class="info-mini"><small>成立 / 立项</small><strong>${esc(c.founded||'待核')}</strong></div><div class="info-mini"><small>行业</small><strong>${esc(c.sector||'待核')}</strong></div><div class="info-mini"><small>规模</small><strong>${esc(c.size||'待核')}</strong></div></div></div><div class="two-col"><div class="content-card"><h3>业务定位与商业模式</h3><p>${esc(c.positioning||'尚无可靠公开资料。')}</p></div><div class="content-card"><h3>发展历史</h3><p>${esc(c.history||'需要后续核实。')}</p></div></div><div class="content-card"><h3>经营现状评估 <span class="pilltag warn">有证据边界</span></h3><p>${esc(c.operating||'未取得足够经营信息。')}</p><div class="hline"></div><h3>实习 / 团队风险</h3><p>${esc(c.risk||'需向HR或面试官询问具体团队职责。')}</p></div><div class="button-group"><button class="btn primary" data-tab="timeline">查看公司最新活动 ${ic('arrow')}</button>${j?`<button class="btn" data-action="opencompany" data-id="${esc(c.id)}">独立打开公司档案</button>`:`<button class="btn" data-tab="leaders">调研领导团队</button>`}</div>`}
function renderLeaders(c){const leaders=c.leaders||[];return `<div class="note-box"><b>领导人研究规则：</b>仅收录公开职业身份和经历。法定代表人不等于实际业务主管，集团CEO也不等于实习岗位导师。</div><div class="section-head"><div><h2>公开领导人与核心人物</h2><p>所有职务均标注资料适用时间，需面试前核对</p></div></div>${leaders.length?leaders.map(x=>`<div class="content-card"><h3>${esc(x.name)}</h3><div class="pilltag ink" style="margin-bottom:10px">${esc(x.role)}</div><p>${esc(x.note)}</p>${srclink(x.source,'查看人物信息来源')}</div>`).join(''):`<div class="empty">${ic('user')}<h3>暂无可靠领导人资料</h3><p>不要臆测个人身份。可在面试中询问团队负责人及带教方式。</p></div>`}<div class="content-card"><h3>进一步应当核实</h3><p>① 实习岗位直属主管是谁？② 谁负责指导和评价实习生？③ 部门近期最重要的项目是什么？④ 管理者公开关注的战略问题有哪些？</p></div>`}
function renderTimeline(c){const events=[...(c.timeline||[]),...(state.companyEvents[c.id]||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));const last=events[0];return `<div class="note-box"><b>时间轴说明：</b>事件日期与文章发布日期尽量分开。官网、媒体、招聘JD的信息粒度不同；新增事件不会自动连接互联网。</div><div class="section-head"><div><h2>历时性活动记录</h2><p>包含历史里程碑及近12个月的重要事件，最近事件优先</p></div><button class="btn" data-action="addevent" data-id="${esc(c.id)}">${ic('plus')} 手动添加事件</button></div>${events.length?`<div class="vertical-timeline">${events.map(e=>`<div class="timeline-item"><div class="timeline-date">${esc(e.date||'时间待核')}</div><h4>${esc(e.title||'未命名事件')}</h4><p>${esc(e.details||'')}</p>${e.impact?`<div class="tip-mini"><b>对求职的意义：</b>${esc(e.impact)}</div>`:''}<div style="margin-top:9px">${srclink(e.source||e.url,'查阅来源')}</div></div>`).join('')}</div>`:empty('暂无动态','可以手动新增已核实的新闻和活动。')}<div class="note-box"><b>最新记录：</b>${last?esc(last.date+' · '+last.title):'暂无'}<br><b>动态更新策略：</b>投递前核验职位，收到面试后重点检查最近30天事件与领导调整；本地版不会自动更新。</div>`}
function renderRelatedJobs(c){let list=getJobs().filter(j=>j.company===c.id);return `<div class="section-head"><div><h2>关联岗位</h2><p>公司资料共用，简历与面试策略按具体JD分别生成</p></div></div><div class="job-grid">${list.map(renderJobCard).join('')}</div>`}
function renderResume(j,c){const ids=state.materialSelected[j.id]||j.resume||[],material=ids.map(getMat).filter(Boolean);const copyItems=()=>0;return `<div class="note-box"><b>针对 ${esc(c.name)} 的策略：</b>${esc(j.apply||j.why)}<br>与岗位要求的匹配程度可调整经历排序，但不能新增未经证实的数据或个人贡献。</div><div class="section-head"><div><h2>选择简历证据</h2><p>直接复用上传的个人素材库，勾选后复制到你的简历草稿</p></div><button class="btn primary" data-action="copyresume">${ic('copy')} 复制选中素材</button></div>${(j.resume||[]).map(id=>{const m=getMat(id);if(!m)return '';const checked=ids.includes(id);return `<label class="resume-evidence"><input type="checkbox" data-material-select="${esc(id)}" ${checked?'checked':''}><div style="flex:1"><strong>${esc(m.title)}</strong><p>${(m.std||[m.one]).map(x=>esc(x)).join('；')}</p>${m.todo?.length?`<div class="tiny" style="color:#a4774f;margin-top:4px">待补证据：${esc(m.todo.slice(0,2).join('；'))}</div>`:''}</div></label>`}).join('')}<div class="content-card"><h3>岗位要求 → 你的证据</h3>${(j.tasks||[]).map((x,i)=>`<p><b>${i+1}.</b> ${esc(x)}<br><span class="muted tiny">建议对应：${esc((material[i%Math.max(1,material.length)]||{}).title||'补充匹配案例')}</span></p>`).join('')}</div><div class="content-card"><h3>简历准备提醒</h3><p>核心经历优先展现“我做了什么—采用什么方法—产出了什么结果”。学术论文与核图智策有部分待补字段，不建议自己推断。</p></div>`}
function renderInterview(j,c){const done=state.interviewDone[j.id]||[];return `<div class="note-box"><b>面试逻辑：</b>先讲与你岗位相关的能力证据，再将企业最近活动连接到工作任务，最后通过反向提问查清岗位边界。</div><div class="section-head"><div><h2>高优先级问题</h2><p>${done.length} / ${(j.interview||[]).length} 已准备</p></div></div>${(j.interview||[]).map((q,i)=>`<label class="qrow"><input type="checkbox" data-question="${i}" ${done.includes(i)?'checked':''}><p><b>Q${i+1}.</b> ${esc(q)}</p><span class="pilltag ${done.includes(i)?'good':'neutral'}">${done.includes(i)?'已准备':'待准备'}</span></label>`).join('')}<div class="content-card" style="margin-top:18px"><h3>建议准备的真实案例</h3>${(j.resume||[]).slice(0,3).map(id=>{const m=getMat(id);return m?`<p class="dotline">${esc(m.title)}</p>`:''}).join('')}<p class="muted tiny">建议按背景→任务→行动→结果→反思结构，单个案例准备60秒和2分钟两个版本。</p></div><div class="content-card"><h3>公司最近动态切入点</h3>${(c.timeline||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,2).map(e=>`<p><b>${esc(e.date)}：</b>${esc(e.title)}<br>${e.impact?esc(e.impact):'可思考其对业务需求的影响；不应直接推断岗位团队正在参与该事件。'}</p>`).join('')||'<p>暂无足够的公开活动信息，请准备一个基于JD的具体业务问题。</p>'}</div><div class="content-card"><h3>反向提问清单</h3><p>① 这次实习主要参与哪些真实项目？<br>② 前两周通常如何安排带教？<br>③ 目前业务团队最希望实习生解决什么问题？<br>④ 我的到离岗日期能否被完整接受？<br>⑤ 是否可开具实习证明，成果如何处理保密？</p></div>`}
function renderTracking(j,c){const note=state.jobNotes[j.id]||{},st=status(j.id);return `<div class="info-grid"><div class="info-mini"><small>当前进度</small><strong>${esc(st)}</strong></div><div class="info-mini"><small>已记录核验</small><strong>${esc(fmtDate(state.lastVerified[j.id]))}</strong></div><div class="info-mini"><small>岗位截止</small><strong>${esc(fmtDate(j.deadline))}</strong></div></div><div class="content-card"><h3>进度与行动</h3><label class="form-label">当前阶段</label><select id="track-status" class="field">${['候选','准备投递','已投递','笔试/面试','Offer','已结束'].map(x=>`<option ${x===st?'selected':''}>${x}</option>`).join('')}</select><label class="form-label">下一次跟进日期</label><input id="track-followup" type="date" class="field" value="${esc(note.followup||'')}"><label class="form-label">联系/投递渠道</label><input id="track-channel" class="field" placeholder="例如：实习僧、邮件、官网" value="${esc(note.channel||'')}"><label class="form-label">沟通摘要、反馈与待办</label><textarea id="track-notes" class="field" rows="5" placeholder="例如：10月31日已查看JD；需与HR确认11月20日到岗是否可接受。">${esc(note.text||'')}</textarea><div class="button-group" style="margin-top:14px"><button class="btn primary" data-action="savetrack">${ic('check')} 保存投递进度</button><button class="btn" data-action="verified" data-id="${esc(j.id)}">${ic('shield')} 我已手动核验岗位</button></div></div><div class="note-box"><b>提醒：</b>“已手动核验”只记录你自行打开来源后进行了核验，系统并未自动访问、比较或验证网页。推荐每次投递前检查岗位状态与截止日。</div>`}
function renderSources(c,j){const sources=[...(c.sources||[])];if(j)sources.unshift({label:j.title+'原始招聘线索',url:j.url,type:j.sourceType||'招聘平台',date:j.posted||''});return `<div class="note-box"><b>来源可信度与日期：</b>优先官网、政府和直接招聘页；转载与聚合站点作为线索而不是招聘有效性的充分证明。公司负责人和财务信息必须单独核验。</div><div class="section-head"><div><h2>出处与追溯</h2><p>链接需要联网才能打开，但工作台本身离线可用</p></div></div><div class="source-list">${sources.map(s=>`<div class="source-row"><div><strong>${esc(s.label)}</strong><small>${esc(s.type||'公开资料')} ${s.date?'· '+esc(s.date):''}</small></div>${srclink(s.url,'打开')}</div>`).join('')}</div><div class="content-card" style="margin-top:17px"><h3>个人研究与核实笔记</h3><textarea id="company-note" class="field" rows="6" placeholder="记录你自己核实的事实、待追问的风险与资料来源。">${esc(state.companyNotes[c.id]||'')}</textarea><button class="btn primary" style="margin-top:12px" data-action="savecompanynote">保存公司笔记</button></div>`}
// --- Modal, export/import and event handlers ---
function openModal(inner){byId('modal').innerHTML=inner;byId('modal').classList.add('show');document.body.classList.add('locked');}
function closeModal(){byId('modal').classList.remove('show');byId('modal').innerHTML='';document.body.classList.toggle('locked',Boolean(opened.kind));}
function addJobForm(){const cs=getCompanies();openModal(`<div class="modal-box" role="dialog" aria-modal="true" aria-label="添加岗位"><div class="modal-header"><div><div class="eyebrow">ADD OPPORTUNITY</div><h3>新增候选岗位</h3></div><button class="icon-btn" data-action="closemodal">${ic('x')}</button></div><form id="addjob-form"><label class="form-label">公司</label><select name="company" class="field" required>${cs.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select><label class="form-label">岗位名称 *</label><input class="field" name="title" required maxlength="100" placeholder="例如：行业研究实习生"><div class="pref-row"><div><label class="form-label">城市</label><input class="field" name="city" maxlength="30" placeholder="例如：北京"></div><div><label class="form-label">方向</label><select class="field" name="category">${['政策研究','行业研究','用户研究','AI产品/运营','内容/项目'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="pref-row"><div><label class="form-label">实习时长</label><input class="field" name="duration" placeholder="如至少2个月"></div><div><label class="form-label">截止日期</label><input class="field" name="deadline" type="date"></div></div><label class="form-label">岗位来源URL</label><input class="field" name="url" type="url" placeholder="https://..."><label class="form-label">初步匹配理由</label><textarea class="field" name="why" rows="3" placeholder="为什么考虑这份岗位"></textarea><div class="modal-footer"><button class="btn" type="button" data-action="closemodal">取消</button><button class="btn primary" type="submit">保存岗位</button></div></form></div>`)}
function addCompanyForm(){openModal(`<div class="modal-box" role="dialog" aria-modal="true" aria-label="添加公司"><div class="modal-header"><div><div class="eyebrow">ADD ORGANIZATION</div><h3>新增候选公司</h3></div><button class="icon-btn" data-action="closemodal">${ic('x')}</button></div><form id="addcompany-form"><label class="form-label">公司或机构名称 *</label><input class="field" name="name" maxlength="100" required><div class="pref-row"><div><label class="form-label">所属行业</label><input class="field" name="sector" placeholder="例如：产业咨询"></div><div><label class="form-label">城市</label><input class="field" name="city" placeholder="例如：北京"></div></div><label class="form-label">企业简介</label><textarea class="field" name="summary" rows="3" placeholder="仅录入已核实或标注为待核查的内容"></textarea><div class="modal-footer"><button class="btn" type="button" data-action="closemodal">取消</button><button class="btn primary" type="submit">保存公司</button></div></form></div>`)}
function addEventForm(id){openModal(`<div class="modal-box" role="dialog" aria-modal="true" aria-label="新增公司动态"><div class="modal-header"><div><div class="eyebrow">RESEARCH LOG</div><h3>新增已核实事件</h3></div><button class="icon-btn" data-action="closemodal">${ic('x')}</button></div><form id="addevent-form" data-company="${esc(id)}"><label class="form-label">事件发生日期</label><input class="field" name="date" type="date" required><label class="form-label">事件标题 *</label><input class="field" name="title" required maxlength="150"><label class="form-label">事件摘要</label><textarea class="field" name="details" rows="3"></textarea><label class="form-label">来源链接（建议填写）</label><input class="field" type="url" name="source" placeholder="https://..."><label class="form-label">对求职的意义 / 个人判断</label><textarea class="field" name="impact" rows="2"></textarea><div class="modal-footer"><button class="btn" type="button" data-action="closemodal">取消</button><button class="btn primary" type="submit">保存事件</button></div></form></div>`)}
function saveBlob(filename,data){const blob=new Blob([data],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function doExport(){saveBlob('李怡晖_求职工作台_备份_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({kind:'backup',schemaVersion:1,exportedAt:new Date().toISOString(),state},null,2));showToast('已导出JSON备份，请妥善保管包含个人求职信息的文件。')}
function template(){const sample={kind:'intel-update',schemaVersion:1,updatedAt:'2026-11-01',companies:[{id:'chen',appendTimeline:[{date:'2026-11-01',title:'【示例】新增企业动态',details:'请替换为已核实信息',source:'https://example.com/article',impact:'对岗位或面试策略的实际意义'}]}],jobs:[{id:'chen-research',note:'【示例】建议人工打开岗位页核实招聘状态'}]};saveBlob('工作台_情报更新包_示例.json',JSON.stringify(sample,null,2));showToast('模板已下载，可按示例更新已存在的公司及岗位。')}
function ingested(obj){if(!obj||obj.schemaVersion!==1)throw new Error('只支持 schemaVersion=1 的JSON文件');if(obj.kind==='backup'){if(!obj.state||typeof obj.state!=='object')throw new Error('备份文件缺少 state');if(!confirm('导入完整备份会覆盖当前本地进度。是否继续？'))return false;state={...structuredClone(DEFAULT),...obj.state,filters:{...DEFAULT.filters,...(obj.state.filters||{})},prefs:{...DEFAULT.prefs,...(obj.state.prefs||{})},weights:{...DEFAULT.weights,...(obj.state.weights||{})}};save();render();closeDetail();return true}if(obj.kind==='intel-update'){for(const c of obj.companies||[]){if(!c.id||!/^[-_a-zA-Z0-9]{2,70}$/.test(c.id))continue;const old=state.intelCompanies[c.id]||{};state.intelCompanies[c.id]={...old,...c,appendTimeline:[...(old.appendTimeline||[]),...(c.appendTimeline||[])],appendSources:[...(old.appendSources||[]),...(c.appendSources||[])],appendLeaders:[...(old.appendLeaders||[]),...(c.appendLeaders||[])]}}for(const j of obj.jobs||[]){if(!j.id||!/^[-_a-zA-Z0-9]{2,70}$/.test(j.id))continue;state.intelJobs[j.id]={...(state.intelJobs[j.id]||{}),...j}}save();render();if(opened.kind)renderDetail();return true}throw new Error('不支持的文件类型；请使用工作台导出备份或情报更新模板')}
window.CareerIntelBridge={schemaVersion:1,importPackage:obj=>ingested(obj),exportBackup:()=>({kind:'backup',schemaVersion:1,exportedAt:new Date().toISOString(),state:structuredClone(state)})};
function importClick(){byId('import-file').click()}
function copyText(txt){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>showToast('已复制到剪贴板')).catch(()=>fallbackCopy(txt))}else fallbackCopy(txt)}
function fallbackCopy(txt){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showToast('已复制到剪贴板')}catch(e){showToast('浏览器限制复制，请使用文本导出或手动复制')}ta.remove()}
function capturePref(){state.prefs.start=byId('start-date').value||META.seasonStart;state.prefs.end=byId('end-date').value||META.seasonEnd;state.prefs.days=Number(byId('pref-days').value)||5;let city=byId('cost-city').value;state.prefs.costCity=city;state.prefs.cityRent=state.prefs.cityRent||{};state.prefs.commute=state.prefs.commute||{};let r=byId('city-rent').value,t=byId('city-commute').value;if(r==='')delete state.prefs.cityRent[city];else state.prefs.cityRent[city]=Math.max(0,Number(r));if(t==='')delete state.prefs.commute[city];else state.prefs.commute[city]=Math.max(0,Number(t));save();showToast('偏好与成本已保存');render()}
function action(name,id,element){const job=opened.kind==='job'?getJob(opened.id):null;switch(name){case 'theme':state.theme=state.theme==='light'?'dark':'light';save();render();if(opened.kind)renderDetail();break;case 'favorite':state.favs=state.favs.includes(id)?state.favs.filter(x=>x!==id):[...state.favs,id];save();render();if(opened.kind)renderDetail();break;case 'onlyfav':state.filters.fav=!state.filters.fav;save();render();break;case 'close':closeDetail();break;case 'closemodal':closeModal();break;case 'resetweights':state.weights={...META.weights};save();render();showToast('已恢复约定权重');break;case 'resetrating':if(job){delete state.ratingOverrides[job.id];save();renderDetail();}break;case 'addjob':addJobForm();break;case 'addcompany':addCompanyForm();break;case 'addevent':addEventForm(id);break;case 'export':doExport();break;case 'import':importClick();break;case 'template':template();break;case 'savepref':capturePref();break;case 'matopen':state.materialExpanded=state.materialExpanded.includes(id)?state.materialExpanded.filter(x=>x!==id):[...state.materialExpanded,id];save();render();break;case 'copy-material':{const m=getMat(id);if(m)copyText((m.std||[m.one]).join('\n'));break}case 'copyresume':{if(!job)break;let ids=state.materialSelected[job.id]||job.resume||[];let data=`目标：${getCompany(job.company).name}｜${job.title}\n\n`+ids.map(id=>{const m=getMat(id);return m?`【${m.title}】\n${(m.std||[m.one]).join('\n')}`:''}).filter(Boolean).join('\n\n');if(!ids.length)return showToast('请至少勾选一项经历');copyText(data);break}case 'savetrack':{if(!job)break;state.progress[job.id]=byId('track-status').value;state.jobNotes[job.id]={followup:byId('track-followup').value,channel:byId('track-channel').value,text:byId('track-notes').value};save();render();renderDetail();showToast('投递记录已保存');break}case 'verified':{if(!job)break;state.lastVerified[job.id]=new Date().toISOString().slice(0,10);save();renderDetail();showToast('已记录你手动核验的日期；系统没有自动联网检查');break}case 'savecompanynote':{const c=opened.kind==='company'?opened.id:getJob(opened.id)?.company;if(!c)return;state.companyNotes[c]=byId('company-note').value;save();showToast('公司研究笔记已保存');break}case 'opencompany':openDetail('company',id,'business');break;case 'clearstate':if(confirm('将清空本地进度、收藏和笔记。这个操作不可撤销。确定继续？')){localStorage.removeItem(KEY);state=structuredClone(DEFAULT);render();showToast('本地记录已清空')}break;}}
function onClick(e){const t=e.target.closest('[data-navgo],[data-nav],[data-openjob],[data-opencompany],[data-tab],[data-action],[data-category],[data-gate]');if(!t)return;if(t.dataset.nav||t.dataset.navgo){navView(t.dataset.nav||t.dataset.navgo);return}if(t.dataset.openjob){openDetail('job',t.dataset.openjob,'overview');return}if(t.dataset.opencompany){openDetail('company',t.dataset.opencompany,'business');return}if(t.dataset.tab){opened.tab=t.dataset.tab;renderDetail();return}if(t.dataset.category){state.filters.category=t.dataset.category;save();render();return}if(t.dataset.gate){state.filters.gate=t.dataset.gate;save();render();return}if(t.dataset.action){action(t.dataset.action,t.dataset.id||'',t);return}}
function onChange(e){let t=e.target;if(t.id==='job-city'){state.filters.city=t.value;save();render();return}if(t.id==='job-sort'){state.filters.sort=t.value;save();render();return}if(t.dataset.weight){state.weights[t.dataset.weight]=+t.value;save();render();return}if(t.dataset.rating){const j=getJob(opened.id);if(!j)return;state.ratingOverrides[j.id]=state.ratingOverrides[j.id]||{};state.ratingOverrides[j.id][t.dataset.rating]=+t.value;save();renderDetail();return}if(t.dataset.materialSelect){let id=opened.id,j=getJob(id),mat=t.dataset.materialSelect,cur=state.materialSelected[id]||[...(j.resume||[])];cur=t.checked?[...new Set([...cur,mat])]:cur.filter(x=>x!==mat);state.materialSelected[id]=cur;save();return}if(t.dataset.question!==undefined){const jid=opened.id,i=+t.dataset.question,cur=state.interviewDone[jid]||[];state.interviewDone[jid]=t.checked?[...new Set([...cur,i])]:cur.filter(x=>x!==i);save();renderDetail();return}if(t.id==='cost-city'){state.prefs.costCity=t.value;save();render();return}}
let searchTimer;function onInput(e){let t=e.target;if(t.id==='job-q'){clearTimeout(searchTimer);const val=t.value;searchTimer=setTimeout(()=>{state.filters.q=val;save();render();const a=byId('job-q');if(a){a.focus();a.setSelectionRange(val.length,val.length)}},180)}if(t.id==='company-q'){clearTimeout(searchTimer);const val=t.value;searchTimer=setTimeout(()=>{state.companyQ=val;save();render();const a=byId('company-q');if(a){a.focus();a.setSelectionRange(val.length,val.length)}},180)}}
function onSubmit(e){const form=e.target;if(form.id==='addjob-form'){e.preventDefault();let f=new FormData(form),id='custom-job-'+Date.now();state.customJobs.push({id,company:f.get('company'),title:String(f.get('title')).trim(),category:String(f.get('category')),city:String(f.get('city')).trim()||'待核实',duration:String(f.get('duration'))||'未明确',days:'未明确',pay:'未公开',deadline:f.get('deadline')||'',posted:new Date().toISOString().slice(0,10),url:safeUrl(f.get('url')),sourceType:'用户手动录入',gate:'unknown',confidence:'C',ratings:[3,2.5,2.5,2.5,2.5,2.5],why:String(f.get('why'))||'待补充匹配理由',tasks:[],requirements:[],resume:[],interview:[],concerns:['手动添加，需自行核验岗位有效性']});save();closeModal();render();showToast('已添加新岗位');openDetail('job',id,'overview');return}if(form.id==='addcompany-form'){e.preventDefault();let f=new FormData(form),name=String(f.get('name')).trim(),id='custom-company-'+Date.now();state.customCompanies.push({id,name,monogram:name[0],en:'CUSTOM ORGANIZATION',sector:String(f.get('sector'))||'待核实',city:String(f.get('city'))||'待核实',kind:'待核实',size:'待核实',founded:'待核实',confidence:'C',summary:String(f.get('summary'))||'等待补充公开资料',positioning:'待核实',history:'待核实',operating:'待核实',risk:'待核实',leaders:[],timeline:[],sources:[]});save();closeModal();render();showToast('已添加公司档案');openDetail('company',id,'business');return}if(form.id==='addevent-form'){e.preventDefault();const f=new FormData(form),id=form.dataset.company;state.companyEvents[id]=state.companyEvents[id]||[];state.companyEvents[id].push({date:String(f.get('date')),title:String(f.get('title')),details:String(f.get('details')),source:safeUrl(f.get('source')),impact:String(f.get('impact'))});save();closeModal();renderDetail();showToast('时间轴已更新');return}}
document.addEventListener('click',onClick);document.addEventListener('change',onChange);document.addEventListener('input',onInput);document.addEventListener('submit',onSubmit);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(byId('modal').classList.contains('show'))closeModal();else if(opened.kind)closeDetail()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-opencompany],[data-openjob]')){e.preventDefault();e.target.click()}});byId('scrim').addEventListener('click',closeDetail);byId('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});byId('import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>6*1024*1024)throw new Error('文件过大');const obj=JSON.parse(await file.text());if(ingested(obj))showToast('JSON数据导入成功')}catch(err){showToast('导入失败：'+err.message)}e.target.value=''});render();
})();

</script>
